[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "a-share-research-pipeline"
version = "0.1.2"
description = "Codex-powered daily A-share sell-side research triage and synthesis pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyMuPDF>=1.24,<2",
  "PyYAML>=6,<7",
  "jsonschema>=4.22,<5",
  "Jinja2>=3.1,<4",
  "Flask>=3.0,<4",
]

[project.scripts]
a-share-research = "research_pipeline.cli:main"

[tool.setuptools.packages.find]
include = ["research_pipeline*"]
