project:
  name: "A股研报智能筛选系统"
  timezone: "Asia/Shanghai"
  language: "zh-CN"

paths:
  inbox: "inbox"
  archive: "archive"
  extracted: "extracted"
  database: "database/research.db"
  outputs: "outputs/daily"
  logs: "logs"
  watchlist: "config/watchlist.csv"

codex:
  binary: "codex"
  isolate_user_config: true
  isolate_runtime_workspace: true
  ignore_rules: true
  sandbox: "read-only"
  ask_for_approval: "never"
  web_search: false
  max_parallel: 3
  timeout_seconds: 1800
  retries: 2
  models:
    triage: ""
    synthesis: ""
    deep_dive: ""
    qc: ""
  reasoning_effort:
    triage: "low"
    synthesis: "medium"
    deep_dive: "high"
    qc: "medium"
  verbosity:
    triage: "low"
    synthesis: "medium"
    deep_dive: "high"
    qc: "low"

pipeline:
  batch_max_reports: 4
  batch_max_chars: 260000
  triage_max_pages: 18
  triage_max_chars: 110000
  first_pages: 4
  last_pages: 2
  top_n: 10
  deep_dive_n: 10
  min_deep_dive_score: 65
  run_qc: true
  archive_after_success: false
  reuse_existing_cards: true
  reuse_existing_deep_dives: true
  output_html: true
  excerpt_keywords:
    - "投资要点"
    - "核心观点"
    - "摘要"
    - "结论"
    - "盈利预测"
    - "业绩预测"
    - "目标价"
    - "评级"
    - "估值"
    - "风险"
    - "催化"
    - "资本开支"
    - "产能"
    - "出货"
    - "价格"
    - "毛利率"
    - "EPS"
    - "revenue"
    - "earnings"
    - "forecast"
    - "target price"
    - "valuation"
    - "risk"
    - "catalyst"
    - "capex"

scoring:
  watchlist_relevance: 20
  novelty: 20
  earnings_valuation_impact: 15
  catalyst_certainty: 15
  consensus_divergence: 10
  evidence_quality: 10
  actionability: 10
  duplicate_penalty_max: 25
  stale_penalty_max: 15
  unverified_penalty_max: 15
  holding_negative_boost: 10

output:
  markdown_max_core_chars: 280
  include_source_paths: true
  csv_encoding: "utf-8-sig"

automation:
  schedules:
    - "09:00"
    - "21:00"
  catchup_hours: 4
  poll_interval_seconds: 600
